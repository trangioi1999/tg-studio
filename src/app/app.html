<div class="shell">
  <tg-title-bar />
  <div class="body">
    <tg-thread-list class="sidebar" />
    @switch (ui.screen()) {
      @case ('mission') { <tg-mission-control class="center" /> }
      @case ('usage') { <tg-usage-screen class="center" /> }
      @case ('integrations') { <tg-integrations class="center" /> }
      @case ('agents') { <tg-agents-panel class="center screen-pad" /> }
      @default {
        <tg-agent-panel class="center chat" />
      }
    }
    <!-- Stays alive while closed: it keeps files and diffs fresh and follows the agent. -->
    <tg-side-panel class="side" [class.closed]="ui.screen() !== 'chat' || !ui.sideOpen()" />
  </div>
  <tg-status-bar />
  @if (ui.onboarding()) { <tg-onboarding (done)="ui.onboarding.set(false)" /> }
</div>
