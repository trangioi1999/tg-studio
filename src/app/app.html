<div class="shell" [style]="layout.style()" [class.sb-collapsed]="ui.sidebarCollapsed()" [class.sb-peek]="peek()">
  <tg-title-bar />
  <div class="body">
    <tg-thread-list class="sidebar" [class.rail]="ui.sidebarCollapsed()" />
    @if (peek()) { <div class="sb-scrim" aria-hidden="true" (click)="ui.closePeek()"></div> }
    @if (!ui.sidebarCollapsed() && !ui.narrow()) { <tg-splitter pane="sidebar" /> }
    @switch (ui.screen()) {
      @case ('mission') { <tg-agent-board class="center screen" /> }
      @case ('usage') { <tg-usage-screen class="center screen" /> }
      @case ('settings') { <tg-settings class="center screen" /> }
      @default {
        <tg-agent-panel class="center chat" />
      }
    }
    <!-- Stays alive while closed: it keeps files and diffs fresh and follows the agent. -->
    <tg-side-panel class="side" [class.closed]="ui.screen() !== 'chat' || !ui.sideOpen()" />
  </div>
  <tg-status-bar />
  <tg-quick-open />
  <tg-agent-window />
</div>
