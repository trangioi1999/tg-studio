name: CI

# Runs only by hand (Actions → CI → Run workflow, or `gh workflow run CI`): Actions minutes
# are limited and the owner decides when to spend them. build + npm test + cargo test run
# on the development Mac before every merge (AGENTS.md); this adds Windows (and macOS).
on:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Chạy cả macOS (tốn gấp 10 lần phút)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run version:check
      - run: npm run build
      - run: npm test -- --watch=false
      - run: cargo test
        working-directory: src-tauri
