name: CI

# Private repo: Actions minutes are limited (2,000/month), Windows bills 2x and macOS 10x.
# One run per pull request, nothing for docs or the download site, and only Windows:
# macOS is the development machine, where build + npm test + cargo test run before
# every merge (AGENTS.md). Run it by hand (Actions → CI → Run workflow) when needed.
on:
  pull_request:
    paths-ignore: ['docs/**', 'site/**', '**/*.md']
  workflow_dispatch:
    inputs:
      macos:
        description: 'Chạy cả macOS (tốn gấp 10 lần phút)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run version:check
      - run: npm run build
      - run: npm test -- --watch=false
      - run: cargo test
        working-directory: src-tauri
