name: Download site

# Builds the Windows installer and publishes the download page (site/) to Cloudflare Pages.
# Only the built page, screenshots and installer leave GitHub; the source stays private.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/07-release.md §8).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: download-site
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  deploy:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dl
      - name: Assemble the site
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          exe="$(ls dl/*.exe | head -n 1)"
          mkdir -p site/downloads site/ui-review site/agents
          cp -r docs/ui-review/. site/ui-review/
          cp public/agents/*.svg site/agents/
          name="TG-Studio-${version}-windows-x64-setup.exe"
          cp "$exe" "site/downloads/$name"
          cp "$exe" site/downloads/TG-Studio-latest-windows-x64-setup.exe
          bytes="$(stat -c%s "$exe")"
          printf '{"version":"%s","date":"%s","commit":"%s","windows":{"file":"downloads/%s","bytes":%s}}\n' \
            "$version" "$(date -u +%F)" "${GITHUB_SHA::7}" "$name" "$bytes" > site/version.json
          ls -la site site/downloads
      - name: Create the Pages project (first run only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'tg-studio' }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT || 'tg-studio' }} --branch=main --commit-dirty=true
