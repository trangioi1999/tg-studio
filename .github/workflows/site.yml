name: Download site

# Builds the Windows and macOS (universal) installers, assembles the download page and
# publishes it to the site-dist branch. Cloudflare (a Worker or a Pages project connected
# to this repository in its dashboard) deploys that branch (docs/07-release.md §8). Only
# the built page, screenshots, installers and wrangler.jsonc are on site-dist.
# By hand only (`gh workflow run "Download site"`): it builds installers on macOS and Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-site
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    # One universal build runs on both Intel and Apple Silicon Macs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  deploy:
    # A failed Mac build still publishes Windows; the page then says the Mac build is missing.
    needs: [windows, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dl
      - uses: actions/download-artifact@v4
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: macos-installer
          path: dl-mac
      - name: Assemble the site
        env:
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          exe="$(ls dl/*.exe | head -n 1)"
          mkdir -p site/downloads site/ui-review site/agents
          cp -r docs/ui-review/. site/ui-review/
          cp public/agents/*.svg site/agents/
          # Shipped as a zip, like the builds shared by hand: browsers and mail filters
          # treat a bare unsigned .exe as suspicious.
          name="TG-Studio-${version}-windows-x64-setup.zip"
          mkdir -p pack
          cp "$exe" "pack/TG Studio ${version} Setup.exe"
          (cd pack && zip -q -9 "../site/downloads/$name" "TG Studio ${version} Setup.exe")
          cp "site/downloads/$name" site/downloads/TG-Studio-latest-windows-x64-setup.zip
          bytes="$(stat -c%s "site/downloads/$name")"
          mac=""
          if ls dl-mac/*.dmg >/dev/null 2>&1; then
            dmg="$(ls dl-mac/*.dmg | head -n 1)"
            mname="TG-Studio-${version}-macos-universal.zip"
            cp "$dmg" "pack/TG Studio ${version}.dmg"
            (cd pack && zip -q -9 "../site/downloads/$mname" "TG Studio ${version}.dmg")
            cp "site/downloads/$mname" site/downloads/TG-Studio-latest-macos-universal.zip
            mac="$(printf ',"macos":{"file":"downloads/%s","bytes":%s}' "$mname" "$(stat -c%s "site/downloads/$mname")")"
          elif git fetch --depth 1 origin site-dist && git show FETCH_HEAD:site/version.json > prev.json; then
            # GitHub often has no macOS runner to spare: keep the build published last time
            # rather than dropping macOS from the page.
            mfile="$(node -p "(require('./prev.json').macos || {}).file || ''")"
            if [ -n "$mfile" ] && git show "FETCH_HEAD:site/$mfile" > "site/$mfile"; then
              cp "site/$mfile" site/downloads/TG-Studio-latest-macos-universal.zip
              mac=",\"macos\":$(node -p "JSON.stringify(require('./prev.json').macos)")"
              echo "macOS: kept $mfile from the previous publish"
            fi
          fi
          printf '{"version":"%s","date":"%s","commit":"%s","windows":{"file":"downloads/%s","bytes":%s}%s}\n' \
            "$version" "$(date -u +%F)" "${GITHUB_SHA::7}" "$name" "$bytes" "$mac" > site/version.json
          # site-dist holds site/ plus a wrangler.jsonc, so Cloudflare can deploy it either as
          # Pages (output directory "site") or as a Worker serving only site/ as static assets.
          mkdir publish
          mv site publish/site
          printf '{\n  "name": "%s",\n  "compatibility_date": "2025-01-01",\n  "assets": { "directory": "./site" }\n}\n' \
            "${CF_WORKER_NAME:-tg-studio}" > publish/wrangler.jsonc
          ls -la publish publish/site/downloads
      # Cloudflare Pages is connected to this repository in its dashboard and deploys the
      # site-dist branch. The branch holds only the built site, under site/, and is
      # replaced on every run so installers never pile up in its history.
      - name: Publish to the site-dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site-dist
          publish_dir: ./publish
          force_orphan: true
          commit_message: "chore(site): publish ${{ github.sha }}"
