[package]
name = "tg-studio"
version = "0.6.5"
description = "TG Studio — multi-agent coding desktop app"
authors = ["Trần Giỏi"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "tg_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time", "net", "io-std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"
dunce = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
portable-pty = "0.9"
