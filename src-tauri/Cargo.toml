[package]
name = "tg-studio"
version = "0.1.0"
description = "TG Studio — multi-agent coding desktop app"
authors = ["Trần Giỏi"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "tg_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }
